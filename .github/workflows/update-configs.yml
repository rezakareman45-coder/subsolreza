name: Update Configs

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update configs
        run: python -c "
import requests, random
subs = ['https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt','https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/super-sub.txt','https://raw.githubusercontent.com/barry-far/V2ray-Config/main/All_Configs_Sub.txt']
all_configs = []
n = 1
for url in subs:
  try:
    r = requests.get(url, timeout=15)
    if r.status_code == 200:
      lines = [line.strip() for line in r.text.splitlines() if line.strip() and '#' in line]
      selected = random.sample(lines, min(18, len(lines)))
      for c in selected:
        base = c.split('#')[0]
        all_configs.append(base + '#reza' + str(n))
        n += 1
  except: pass
all_configs = list(dict.fromkeys(all_configs))
open('Sub.txt','w',encoding='utf-8').write('\n'.join(all_configs))
print('Done', len(all_configs))
"
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add Sub.txt
          git commit -m "Auto update" || echo no change
          git push
